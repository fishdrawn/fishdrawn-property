            "content": `<h2>Kimi Code 桌面端：从浏览器搬进本地</h2>
<p>9 月 21 日，月之暗面正式发布 Kimi Code 的桌面客户端，macOS 和 Windows 同步上线，官网入口是 kimi.com/code。此前 Kimi Code 主要跑在网页、终端和 IDE 插件里，这次桌面端补上了最后一块拼图，也把"AI 编程 Agent"从浏览器标签页挪到了本地桌面。</p>
<p>桌面端最大的价值不是"多一个客户端"，而是<strong>少切几次窗口</strong>。它能以对话方式读写代码、执行命令、完成一串自动化任务，不用在编辑器、终端、浏览器之间来回跳。下面这 5 个点，是实测下来最值得用的。</p>

<h2>一、内置终端：说一句话就能跑命令</h2>
<p>桌面端自带终端，Agent 可以直接执行测试、构建和脚本，并读取运行结果再决定下一步。对"改完代码顺手跑个单测"这类高频动作，省掉了手动复制粘贴命令的来回。</p>

<h2>二、内置浏览器：查文档、看页面不用切出去</h2>
<p>它能自己搜索网页、读取页面内容。写代码时遇到不熟的 API、要核对官方文档，直接让 Agent 去查，把结论带回来，比切浏览器再复制链接快得多。</p>

<h2>三、Git 状态与 PR 联动：改动一眼看清</h2>
<p>桌面端内置 Git 状态查看，能直接审阅代码改动，并关联 PR 状态。这样"我到底改了哪些文件、有没有漏提交、PR 走到哪一步了"这些事，不用切到网页去看，跟踪评审和合并进度更顺手。</p>

<h2>四、对话式读写：先读懂整个代码库</h2>
<p>它的工作方式是搜索、阅读、分析你现有的代码，再动手实现功能、修 bug、重构。换句话说，它不是"补全一行"，而是"理解一个项目"。对刚接手别人代码、或者代码库偏大的项目，这种"先读懂再改"的路径更靠谱。</p>

<h2>五、K3 模型 + 1M 上下文，一套订阅多端通用</h2>
<p>桌面端接上了 K3 模型，最高支持 100 万 token 上下文——大代码库、长文档能一次性喂进去，少了很多"分批塞、反复丢上下文"的麻烦。更实在的是订阅制：一份订阅，桌面端、终端、IDE 插件都能用，不用为每个入口单独付费。</p>

<h2>值不值得装？</h2>
<p>如果你本来就在用 Kimi Code 的终端或 IDE 版，桌面端属于"顺手升级"，装上就能用；如果你还在用网页版来回切，桌面端带来的流畅度提升最明显；如果手头项目不大、只是偶尔改几行，那网页版其实够用，不必为了尝鲜硬换。</p>
<blockquote>一句话总结：AI 编程工具的竞争，已经从"谁的模型更聪明"转向"谁能更少打断你的工作流"。Kimi Code 桌面端这一步，踩的正是后者。</blockquote>
<p style="margin-top:24px;font-size:0.9em;color:#888;">信息来源：AIbase 2026-09-21（月之暗面发布 Kimi Code 桌面端）、Kimi Code 官网 2026-09-22</p>`

<p>9 月 20 日，阿里千问开源了图像模型 Qwen-Image-2.1。这次更新最值得注意的一点，是它把"文生图"和"图像编辑"塞进了同一个模型，视觉生成部分只有 7B 参数，并且<strong>原生支持透明图像的生成与编辑</strong>——模型可以直接产出带透明背景的 PNG，也能对透明图层做修改和抠图，而不是先出图、再换另一款工具去背。</p>

<h2>场景三：用多张参考图统一风格</h2>
<p>这个版本支持最多 10 张参考图。好处是"风格一致性"和"角色一致性"终于好控制了：做系列插画、给同一 IP 出多张图、给产品出一整套主图，把已有的几张当参考丢进去，新图就能延续同样的配色与风格，不用每张都反复调提示词。</p>

            "id": 19,
            "title": "8.8 元买 5000 积分的 AI 中转站被央视点名：省下的钱，可能正拿你的数据来还",
            "category": "变现思路",
            "date": "2026-09-12",
            "tags": ["AI 中转站","API 省钱","数据安全","央视曝光","DeepSeek","本地模型"],
            "excerpt": "二手平台上 8.8 元买 5000 积分、比官方 API 便宜到离谱的\"AI 折扣\"，被央视点名曝光：背后多是第三方 API 中转站，先篡改你的本地配置，再把你的文档、代码转发出去，敏感信息存在被截留倒卖的风险。便宜的到底是谁的代价？想省钱，其实有三条正规路子。",
            "content": `<h2>8.8 元买 5000 积分？央视点名"AI 中转站"</h2>
<p>9 月 11 日，央视曝光了二手平台上泛滥的低价 AI 积分：8.8 元就能买到 5000 积分，折算下来比官方 API 便宜到离谱。调查发现，这些"积分"背后大多是第三方 API 中转站——它们先篡改你本地的软件配置，把请求转到自己的服务器，再用一批廉价账号批量转发给模型厂商。</p>
<p>换句话说，你以为买到的是"折扣 API"，实际上是把每一次提问都交到了一个来路不明的中间人手里。</p>

<h2>便宜从哪来：你的数据就是"过路费"</h2>
<p>正常的 API 调用是一条直线：你的程序 → 官方接口 → 返回结果。中转站硬生生插进来一环：你的程序 → 中转服务器 → 官方接口 → 中转服务器 → 你的程序。</p>
<p>多出来的这一环能赚钱，靠的不只是差价。中转站可以完整看到你的输入和输出，包括你贴进去的办公文档、代码、合同草稿、客户名单。央视报道提到，这些敏感内容存在被截留、倒卖的风险——把文档里的信息转手卖出去，比那 8.8 元值钱得多。</p>
<p>更隐蔽的是配置篡改：不少中转站会引导你修改 host、安装根证书或替换配置文件。这一步一旦做了，之后所有流量走哪条路，就不完全由你说了算了。</p>

<h2>三个必须知道的风险</h2>
<p><strong>一是数据泄露。</strong>代码是很多人的命根子，贴给中转站等于公开。此前也有中转站把用户请求转卖给第三方当训练数据的案例。</p>
<p><strong>二是账号牵连。</strong>中转站常用批量注册的账号池，一旦某个号违规被封，正在用它的人可能一起被限流、封号，而你连原因都查不到。</p>
<p><strong>三是"跑路"与掉线。</strong>这类服务大多没有正规主体，充值后突然消失、接口时好时坏是家常便饭，出了事基本维权无门。</p>

<h2>想省钱，走这三条正路</h2>
<p><strong>1. 认准官方渠道。</strong>DeepSeek、通义、智谱、Kimi 等国产模型都有官方开放平台，价格本就比国外便宜，还常有新用户额度与活动。与其在二手平台淘"折扣积分"，不如直接翻官网优惠页。</p>
<p><strong>2. 卡准时段和缓存。</strong>DeepSeek 这类平台区分空闲与高峰时段，缓存命中的输入价格能低到十分之一。把批量任务放到夜间跑、把重复的长提示词固定下来，成本能实打实地降下来。</p>
<p><strong>3. 能本地的就本地。</strong>轻量模型现在几百块的显卡就能跑，处理敏感资料时断网本地推理，既省钱又安全。日常小任务交给本地模型，复杂任务再调云端大模型，是最划算的组合。</p>

<blockquote>一句话总结：AI 降价的大趋势是真的，但"便宜到不合理"的价格，标的往往不是钱，而是你的数据。省 API 费之前，先算算泄露一次的代价。</blockquote>
<p style="margin-top:24px;font-size:0.9em;color:#888;">信息来源：IT之家 2026-09-11（央视曝光 AI 中转站低价灰产）</p>`
        },

            "content": `<h2>千问开源 Qwen-Drive-1.0-4B：首个自动驾驶视觉语言模型</h2>
<p>9 月 6 日，阿里千问开源了 Qwen-Drive-1.0-4B，官方称这是首个面向自动驾驶的视觉语言基础模型（VLM）。它基于 Qwen3.5-4B，在预训练阶段统一了 3D 感知与视觉问答，并进一步扩展到运动规划，同时保留通用视觉理解与指令遵循能力；模型提供 SFT 和 RL 两个"规划专家"，训练样本全部来自公开数据，GitHub、Hugging Face、ModelScope 均已上线。</p>
<p>对做自动驾驶、机器人研究的团队来说，4B 参数意味着可以本地微调、甚至部署到车上跑，门槛比动辄几百亿参数的闭源方案低得多。想快速上手的开发者，可以先跑通官方仓库的评估脚本，再基于自己的场景数据做 SFT。</p>

<p>对普通用户和开发者，这件事的提醒很实际：厂商跑分看看就好，真要选模型，拿自己的业务数据实测一轮，比盯着发布会数字靠谱得多。</p>

<p>对普通用户来说，这个信号值得留意：以后买高配电脑（CPU/GPU/NPU）的性价比会越来越高——越来越多日常 AI 能力将免费、离线地跑在你自己的设备上。</p>

            "title": "Gemini 3.8 Flash 低调上线：软件工程 + 智能体场景，低成本部署怎么选？",
            "category": "AI 工具实测",
            "date": "2026-09-03",
            "tags": ["Gemini","谷歌","大模型","智能体","软件工程","AI 工具"],
            "excerpt": "谷歌 9 月 2 日在 DeepMind 官网悄然上线 Gemini 3.8 Flash，没有新闻稿也没有发布会。它主打软件工程和智能体知识工作流，1M 上下文 + 64K 输出，还支持可调\"努力水平\"。这模型适合谁、怎么用最划算？一篇讲清楚。",
            "content": `<h2>Gemini 3.8 Flash：谷歌又一次"低调上新"</h2>
<p>9 月 2 日，谷歌在 DeepMind 官网悄然上线了 Gemini 3.8 Flash——没有新闻稿、没有发布会，页面挂出即算发布。这种"静默更新"通常意味着面向开发者与 API 用户的能力升级：3.8 Flash 基于 3.7 Flash，重点强化了软件工程和智能体知识工作流，官方定位是用较低成本大规模部署"能直接上生产"的通用智能体。</p>

<h2>关键参数：能装下什么活</h2>
<h3>1. 1M 上下文 + 64K 输出</h3>
<p>最高 100 万 token 的上下文窗口，文本输出支持 64K token。整份大型代码仓库、几十页文档可以直接整体塞进去，适合让 AI 通读项目后再动手改代码，而不是一段段喂。</p>

<h3>2. 可调"努力水平"</h3>
<p>延续 Gemini 3 系列的做法，质量、成本、延迟之间可以自己选档：简单任务用低档省 token，复杂推理再拉高档位。对预算敏感的团队，这是控制账单的关键开关。</p>

<h3>3. 能力覆盖广、知识有截止</h3>
<p>官方评测覆盖编程、知识处理、多模态、长上下文、计算机使用、科学推理六类场景，典型用途是软件工程、智能体任务和复杂知识处理流程。注意知识截止日期是 2026 年 3 月，太新的框架和库记得自己补充上下文。</p>

<h2>适合谁、怎么用</h2>
<p>个人开发者：在 Gemini API 或 AI Studio 里直接选用 3.8 Flash，写脚本、批量处理文本、做 RAG 都够用；创业团队：要跑大量并发智能体（客服、数据处理、代码审查）时，Flash 系列比 Pro 系便宜得多，适合先小流量验证再扩容；企业：把重复性知识工作流交给它，比养人工成本低得多。</p>

<h2>三个注意点</h2>
<p>一是官方自己承认模型可能产生幻觉，重要结论要抽查；二是高推理强度下 token 消耗明显变大，偶尔还会响应慢甚至超时，上生产记得加重试机制；三是低调上线意味着配套文档和生态还在补，赶新功能前先确认 API 字段是否齐活。</p>

<blockquote>一句话：预算有限又想跑"干实事"的智能体，3.8 Flash 值得先小规模试水；追求单次最强推理，还是等 Pro 系或直接上更大参数模型。</blockquote>
<p style="margin-top:24px;font-size:0.9em;color:#888;">信息来源：IT之家，2026-09-03，https://www.ithome.com/0/997/702.htm</p>`

            "content": `<h2>Edge 把 Drop 下线了，传文件怎么办？</h2>

<h3>3. 华为分享远程发送：无大小限制的新选项</h3>

<h3>4. 网盘中转：大文件首选</h3>

            "excerpt": "Cursor 和 Claude Code 是今年最火的 AI 编程工具。我用一个真实项目做了对比测试——从零到部署一个完整的博客后台，看看 AI 编程到底靠不靠谱。",
            "content": `<h2>AI 编程进入\"真能用\"阶段了</h2><p>去年 AI 编程还是\"写个 hello world 还行，复杂项目就崩\"的水平。但今年 Cursor 和 Claude Code 的出现，彻底改变了局面。我花了一个周末，用同一个需求——搭建一个带数据库的博客后台——测试了 3 款主流 AI 编程工具。</p><h2>参测工具</h2><ul><li><strong>Cursor</strong> — 基于 VS Code 的 AI IDE，内置 Claude/GPT</li><li><strong>Claude Code (CLI)</strong> — Anthropic 官方出的 AI 终端编程工具</li><li><strong>GitHub Copilot (Agent Mode)</strong> — 传统补全升级版</li></ul><h2>测试项目：一个博客后台</h2><p>需求：用 Next.js + SQLite 搭一个博客后台，包含文章 CRUD、标签管理、Markdown 编辑器。</p><h3>Cursor ★★★★★</h3><p>赢家。它的 Composer 模式（⌘+I）可以直接对话式写代码，说\"帮我加一个文章搜索功能\"，它自己找到文件、改代码、甚至创建新组件。全项目上下文理解做得最好——A 文件改了一个函数名，B 文件的引用它会自动更新。从零到跑起来，花了约 2 小时。</p><h3>Claude Code ★★★★☆</h3><p>终端里用自然语言交互，体验很新奇。最惊艳的是它会自己读文档、查错误日志、提 fix 方案。适合开发者使用——你需要懂一些命令行操作。写代码质量很高，但 UI 类任务（CSS 调样式）不如 Cursor 顺手。耗时约 2.5 小时。</p><h3>GitHub Copilot Agent ★★★☆</h3><p>Copilot 在 VS Code 里直接用，上手门槛最低。但 Agent 模式的多文件编辑能力明显弱于 Cursor——经常需要手动告诉它哪些文件需要改。补全质量稳定，但\"全自动写项目\"还差口气。耗时约 4 小时。</p><h2>关键结论</h2><ul><li><strong>新手推荐：</strong>Cursor。界面友好、上下文理解强，几乎不需要懂代码也能把项目搭起来。</li><li><strong>开发者推荐：</strong>Claude Code。代码质量最高，适合重构和调试复杂逻辑。</li><li><strong>小建议：</strong>别让 AI 一次性写太多代码，边写边验证。AI 写的代码 8 成能用，剩下的 2 成调试起来可能是最花时间的。</li></ul><blockquote>一句话：2026 年，不会用 AI 编程就像 2010 年不会用 Stack Overflow。不是替代你写代码，是让你写得更快。</blockquote><p style="margin-top:24px;font-size:0.9em;color:#888;">实测日期：2026年7月 · 所有测试使用工具最新付费版本</p>`

            "tags": ["AI视频", "Sora", "可灵", "实测对比"],
            "content": `\n        <h2>背景：AI 视频生成进入实用阶段了吗？</h2>\n        <p>2026 年可以说是 AI 视频生成的分水岭。从 OpenAI Sora 的正式上线，到国产可灵、Vidu 的全面追赶，AI 视频已经不是半年前的\"鬼畜动图\"水平了。但问题是：<strong>到底能不能真正拿来干活？</strong></p>\n        <p>我们花了 7 天时间，用同一个脚本——\"30 秒产品宣传片\"——来实测 5 款主流工具，从生成质量、速度、可控性、价格四个维度打分。</p>\n        <h2>参测工具</h2>\n        <ul>\n            <li><strong>OpenAI Sora</strong> — 行业标杆，视频生成领域的 GPT</li>\n            <li><strong>可灵 2.0（Kling）</strong> — 快手出品，国产最强</li>\n            <li><strong>Runway Gen-3</strong> — 老牌 AI 视频工具</li>\n            <li><strong>Vidu 2.0</strong> — 国内新秀，主打高可控性</li>\n            <li><strong>Pika 2.0</strong> — 轻量化快速出片</li>\n        </ul>\n        <h3>Sora ★★★★★</h3>\n        <p>画面质量最高，光影真实度惊人。尤其物理模拟做得很好：水的流动、人物的动作都非常自然。缺点是生成速度慢（约 8-10 分钟一段 10 秒视频），且价格贵——$20/月只能做少量生成。</p>\n        <h3>可灵 2.0 ★★★★☆</h3>\n        <p>国产最强，没有之一。画面质量接近 Sora 的 85%，支持图生视频和文字生视频。最惊喜的是运动稳定性——人物不崩脸、物体不穿模。速度比 Sora 快一倍。价格也更亲民（约￥99/月）。</p>\n        <h3>Runway Gen-3 ★★★★</h3>\n        <p>可控性最好：支持关键帧、摄像机运动、蒙版控制。适合专业创作者，但上手门槛高。画面细腻度略逊 Sora。</p>\n        <h3>Vidu 2.0 ★★★☆</h3>\n        <p>国产新秀，特色是\"参考视频\"功能——可以上传一段视频让 AI 学习风格。这个对于做系列内容很实用。画面质量中上，偶尔会出现物理失真的问题。</p>\n        <h3>Pika 2.0 ★★★</h3>\n        <p>最快出片——5 秒钟就能生成一段 3 秒视频。适合做表情包、短素材，但做广告级的完整视频还差点意思。</p>\n        <h2>结论：到底该用哪款？</h2>\n        <div class="recommend-table">\n            <p><strong>预算充足、追求极致效果 → Sora</strong></p>\n            <p><strong>国产、性价比 → 可灵 2.0</strong></p>\n            <p><strong>专业创作、想要精细控制 → Runway</strong></p>\n            <p><strong>批量出短素材 → Pika</strong></p>\n        </div>\n        <h2>变现思路：AI 视频能赚钱吗？</h2>\n        <p>实测结论：可以，但不要想得太美好。目前用 AI 视频变现主要有 3 个路径：</p>\n        <ul>\n            <li><strong>短视频矩阵号：</strong>用 AI 快速生成科普/故事类短视频，分发到抖音、视频号赚流量分成。关键是批量产出，一个号一天发 3-5 条。</li>\n            <li><strong>企业宣传片外包：</strong>小企业请不起传统视频团队，AI 视频 + 简单人工剪辑，报价 500-2000 元/条，成本几乎为零。</li>\n            <li><strong>AI 视频教程/模板：</strong>在知识付费平台卖 Prompt 模板或操作教程，单价低但几乎零成本可无限复制。</li>\n        </ul>\n        <blockquote>一句话总结：AI 视频生成已经过了\"能不能用\"的阶段，现在是\"怎么用好\"的问题。选对工具 + 找对场景，确实能省下几万块的制作费。</blockquote>\n        <p style="margin-top:24px;font-size:0.9em;color:#888;">实测日期：2026年7月 · 所有测试使用工具最新付费版本</p>`
        },

            "content": `<h2>为什么测 DeepSeek V4？</h2><p>最近 DeepSeek V4 发布了，作为国产 AI 的代表之一，网上评价两极分化。有人说它已经超越 GPT，有人说它只是炒作。我们花了三天时间，从三个维度做了完整测试。</p><h2>测试一：代码能力</h2><p>我们用了一个实际的前端项目——一个带数据可视化的仪表盘——让 DeepSeek V4 从头写。结果是：<strong>基础框架一次性通过</strong>，复杂逻辑需要两次纠错。整体水平大概在 GPT-4 的 85% 左右。</p><h2>测试二：写作能力</h2><p>让 DeepSeek V4 和 GPT-4 写同一篇小红书文案（主题：AI 工具的副业变现）。两者的输出风格差异明显：DeepSeek 更理性、数据驱动；GPT-4 更感性、故事驱动。中文表达上 DeepSeek 更自然，没有翻译腔。</p><h2>测试三：逻辑推理</h2><p>我们用了几道经典的逻辑题（比如狼羊菜过河、药瓶问题）。DeepSeek V4 全部正确，而且推理过程清晰。在复杂多步推理上表现不错。</p><h2>总结</h2><ul><li><strong>优点：</strong>中文能力强、推理靠谱、免费可用</li><li><strong>缺点：</strong>代码细节有时出错、对长 context 的记忆不够稳定</li><li><strong>推荐人群：</strong>日常写作、头脑风暴、基础编程学习</li></ul><p>一句话：不是神，但绝对够用，而且是免费的。</p><blockquote>评分：★★★★（4/5）—— 国产 AI 的骄傲，日常够用。</blockquote>`

    const $ = id => document.getElementById(id);
    const listEl = $('post-list');
    const viewEl = $('article-view');
    let currentFilter = 'all';

    function renderList(filter) {
        const filtered = filter === 'all'
            ? allPosts
            : allPosts.filter(p => p.category === filter);
        if (filtered.length === 0) {
            listEl.innerHTML = '<div class="empty">该分类暂无文章</div>';
            return;
        }
        listEl.innerHTML = filtered.map(p => `
            <div class="post-card" onclick="openArticle(${p.id})">
                <div class="post-category">${p.category}</div>
                <h2>${p.title}</h2>
                <div class="meta">${p.date}</div>
                <div class="excerpt">${p.excerpt}</div>
                <div class="post-tags">${p.tags.map(t => `<span>${t}</span>`).join('')}</div>
            </div>
        `).join('');
        listEl.style.display = 'block';
        viewEl.style.display = 'none';
    }

    window.openArticle = function(id) {
        const post = allPosts.find(p => p.id === id);
        if (!post) return;
        viewEl.innerHTML = `
            <a class="back" onclick="renderList('${currentFilter}')">← 返回文章列表</a>
            <div class="article-content">
                <h1>${post.title}</h1>
                <div class="article-meta">${post.category} · ${post.date}</div>
                ${post.content}
            </div>
        `;
        listEl.style.display = 'none';
        viewEl.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // Filters
    document.querySelectorAll('#nav-filters a').forEach(a => {
        a.addEventListener('click', function(e) {
            document.querySelectorAll('#nav-filters a').forEach(x => x.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            renderList(currentFilter);
        });
    });

    // Init
    renderList('all');
})();
